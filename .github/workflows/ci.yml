# Builds the project and runs all the tests on Windows, Linux and macOS (Apple Silicon), with the
# warnings of the project targets treated as errors. The golden checksums of each platform are
# printed in the job summary and kept in the ctest-<config> artifact, to compare the platforms.
# The build uses the cores of the runner and a compiler cache (ccache), the tests run in parallel
# except those that measure a time (tests/serial_tests.cmake).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  rules:
    name: project rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check the file sizes and the terrain_core includes
        run: python3 scripts/check_project_rules.py

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One failing platform must not cancel the others: each one tells something.
      fail-fast: false
      matrix:
        include:
          # Ninja on Windows: the Visual Studio generator compiles the sources of a target one by
          # one and cannot use a compiler cache.
          - { name: windows-msvc, os: windows-latest, generator: Ninja }
          - { name: linux-gcc, os: ubuntu-latest, generator: Unix Makefiles, cc: gcc, cxx: g++ }
          - { name: linux-clang, os: ubuntu-latest, generator: Unix Makefiles, cc: clang, cxx: clang++ }
          - { name: macos-appleclang, os: macos-latest, generator: Unix Makefiles }
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v5

      # glad 2 generates the OpenGL loader of the viewer with Python and Jinja2. CMake is given
      # this interpreter: on macOS it would otherwise find another one, without Jinja2.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Jinja2
        run: python -m pip install jinja2

      # Ninja and the environment of cl.exe (the Developer Command Prompt), for the Ninja generator.
      - name: Install Ninja
        if: runner.os == 'Windows'
        run: python -m pip install ninja
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install the X11 headers needed by GLFW
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev

      # Sources of GLFW and glad, kept out of the build directory. The sub-builds that fetched
      # them are cached too and depend on the CMake generator, hence the runner image and the
      # generator in the key. The cores of the runner run the tests.
      - name: Identify the runner image
        id: image
        run: |
          echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "cores=$(python -c 'import os; print(os.cpu_count() or 1)')" >> "$GITHUB_OUTPUT"
      - name: Restore the FetchContent dependencies
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: |
            build-deps/*-src
            build-deps/*-subbuild
          key: fetchcontent-${{ matrix.name }}-${{ matrix.generator }}-${{ steps.image.outputs.version }}-${{ hashFiles('terrain_viewer/CMakeLists.txt') }}

      # The objects of the last build of this job (one cache per runner and compiler): only what
      # changed is compiled again. ccache gives an object back only for the same preprocessed
      # source, options and compiler; every test always runs. Saved at the end of the job.
      - name: Restore the compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.name }}
          max-size: 200M
          evict-old-files: job

      - name: Configure
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then
            export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          fi
          python_exe="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.executable).as_posix())')"
          cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release \
            -DTERRAIN_WARNINGS_AS_ERRORS=ON \
            -DFETCHCONTENT_BASE_DIR=build-deps -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPython_EXECUTABLE="$python_exe"

      # Saved as soon as the dependencies are fetched, so that a red build or test still keeps them.
      - name: Save the FetchContent dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            build-deps/*-src
            build-deps/*-subbuild
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Build (warnings as errors)
        id: build
        run: cmake --build build --config Release --parallel

      # Temporary (agent 42, removed before the merge): the command lines of cl.exe for a source of
      # terrain_core and a test, to compare the generators: from the tracking logs of MSBuild with
      # Visual Studio, from ninja -t commands with Ninja.
      - name: Show the MSVC compile lines (temporary)
        if: runner.os == 'Windows' && !cancelled()
        run: |
          python - <<'EOF'
          import pathlib, re, subprocess
          wanted = {"terrain_core": "\\HEIGHTFIELD.CPP", "det_math_test": "\\DET_MATH_TEST.CPP"}
          if pathlib.Path("build/build.ninja").is_file():
              commands = subprocess.run(["ninja", "-C", "build", "-t", "commands"],
                                        capture_output=True, text=True, check=True).stdout
              for line in commands.splitlines():
                  if re.search(r"[\\/](heightfield|det_math_test)\.cpp\b", line):
                      print(line)
          for tlog in sorted(pathlib.Path("build").rglob("CL.command.1.tlog")):
              project = tlog.parent.name.split(".")[0]
              if project not in wanted:
                  continue
              lines = tlog.read_text(encoding="utf-16").splitlines()
              for i, line in enumerate(lines):
                  sources = line[1:].upper().split("|") if line.startswith("^") else []
                  if any(s.endswith(wanted[project]) for s in sources) and i + 1 < len(lines):
                      print(f"{tlog}: {len(sources)} sources compiled with")
                      print(f"cl.exe {lines[i + 1]}")
          EOF

      # Only when the build above fails: the job stays red, but the tests and the golden
      # checksums of the platform are still obtained.
      - name: Diagnostic rebuild without warnings as errors
        id: rebuild
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "::error::Build failed with warnings as errors; rebuilt without them for the tests."
          cmake -B build -DTERRAIN_WARNINGS_AS_ERRORS=OFF
          cmake --build build --config Release --parallel

      # On every core of the runner. The tests that measure a time run alone (RUN_SERIAL,
      # tests/serial_tests.cmake): only their durations compare from one CI to the next, those of
      # the others include the cores they shared, and their sum is no longer the time of the step.
      - name: Test
        id: test
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.rebuild.outcome == 'success') }}
        run: |
          ctest --test-dir build -C Release --output-on-failure --timeout 300 \
            --parallel ${{ steps.image.outputs.cores }} --output-junit ctest-junit.xml

      - name: Report the golden checksums and the test durations
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        run: python scripts/ci_test_report.py build/ctest-junit.xml ${{ matrix.name }} build/ci-report

      - name: Upload the test results
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: ctest-${{ matrix.name }}
          path: |
            build/ctest-junit.xml
            build/ci-report/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
